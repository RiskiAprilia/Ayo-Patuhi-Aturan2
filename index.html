<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yuk, Kenali Aturan! - Misi Detektif Aturan</title>
<style>
  :root{
    --bg-1:#fef6e4;
    --bg-2:#eef7ff;
    --card-bg:#ffffff;
    --ink:#2e2c3b;
    --ink-soft:#5c5a6e;
    --accent:#6c63ff;
    --accent-soft:#e7e5ff;
    --accent-dark:#4b43d1;
    --select:#cfe8ff;
    --select-border:#7cb8f0;
    --peach:#ffd9b3;
    --mint:#bdf0d6;
    --shadow: 0 8px 22px rgba(60,50,110,0.14);
    --radius-lg: 28px;
    --radius-md: 20px;
    --radius-sm: 14px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, system-ui, sans-serif;
    background: linear-gradient(160deg, var(--bg-2), var(--bg-1));
    color:var(--ink);
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100vw;height:100vh;
    display:flex;flex-direction:column;
  }

  /* ---------- TOP BAR ---------- */
  #topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px;
    flex-shrink:0;
  }
  #topbar .brand{
    display:flex;align-items:center;gap:10px;
    font-size:20px;font-weight:800;color:var(--accent-dark);
  }
  #topbar .brand .dot{
    width:14px;height:14px;border-radius:50%;background:var(--accent);
  }
  #progressWrap{
    display:flex;gap:8px;align-items:center;
  }
  .progress-star{
    width:26px;height:26px;border-radius:50%;
    background:#fff;border:3px solid #e3e0f5;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#bbb;font-weight:700;
    transition:all .25s ease;
  }
  .progress-star.done{
    background:var(--accent);border-color:var(--accent-dark);color:#fff;
  }
  .progress-star.current{
    border-color:var(--accent);color:var(--accent-dark);transform:scale(1.15);
  }
  #btnHome{
    border:none;background:#fff;border-radius:16px;
    padding:10px 18px;font-size:15px;font-weight:700;color:var(--ink-soft);
    box-shadow:var(--shadow);cursor:pointer;
  }

  /* ---------- SCREENS ---------- */
  #screens{
    flex:1;position:relative;overflow:hidden;
  }
  .screen{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    padding:10px 40px 20px;
    overflow-y:auto;
    overflow-x:hidden;
  }
  .screen.active{
    display:flex;
    animation: fadein .45s ease;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .screen-inner{
    width:100%;max-width:1180px;
    flex:1;
    display:flex;flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:14px;
  }

  h1.title{
    font-size:clamp(26px,3.6vw,42px);
    color:var(--accent-dark);
    margin:4px 0 0;
    text-align:center;
    font-weight:900;
  }
  p.subtitle{
    font-size:clamp(16px,2vw,22px);
    color:var(--ink-soft);
    text-align:center;
    margin:0 0 6px;
    max-width:820px;
  }
  p.question{
    font-size:clamp(19px,2.4vw,27px);
    color:var(--ink);
    text-align:center;
    font-weight:700;
    margin:2px 0 8px;
  }

  /* Rara guide bubble */
  .rara-row{
    display:flex;align-items:center;gap:14px;
    background:#fff;border-radius:24px;
    padding:12px 22px;
    box-shadow:var(--shadow);
    max-width:820px;
  }
  .rara-avatar{
    width:58px;height:58px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffdcec, #ff9ecf 70%);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;flex-shrink:0;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.06);
  }
  .rara-text{font-size:18px;font-weight:600;color:var(--ink);}

  /* Buttons */
  .btn{
    border:none;cursor:pointer;
    font-family:inherit;
    font-weight:800;
    border-radius:20px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow:var(--shadow);
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff;
    font-size:20px;
    padding:16px 40px;
    min-height:60px;
  }
  .btn-secondary{
    background:#fff;color:var(--accent-dark);
    font-size:18px;padding:14px 30px;min-height:56px;
    border:2px solid var(--accent-soft);
  }
  .btn-round{
    background:#fff;color:var(--ink-soft);
    width:56px;height:56px;border-radius:50%;
    font-size:22px;
  }

  #navbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 40px 22px;flex-shrink:0;
  }
  #navbar .spacer{width:56px;}

  /* Image choice cards (two big options) */
  .choice-row{
    display:flex;gap:28px;justify-content:center;flex-wrap:wrap;
    width:100%;
  }
  .choice-card{
    background:var(--card-bg);
    border-radius:var(--radius-lg);
    padding:14px;
    width:min(42%, 420px);
    box-shadow:var(--shadow);
    border:4px solid transparent;
    cursor:pointer;
    transition: transform .15s ease, border-color .15s ease;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .choice-card:hover{transform:translateY(-4px);}
  .choice-card.selected{
    border-color: var(--select-border);
    background: var(--select);
  }
  .choice-card img{
    width:100%;aspect-ratio: 4/3;object-fit:cover;
    border-radius:var(--radius-md);
    background:#f1eefc;
  }
  .choice-card .label{
    font-size:18px;font-weight:700;text-align:center;color:var(--ink);
  }

  /* feedback box */
  .feedback-box{
    background:#fff8ec;border-radius:var(--radius-md);
    border:2px dashed var(--peach);
    padding:16px 24px;max-width:820px;
    font-size:18px;text-align:center;color:var(--ink);
    min-height:30px;
    display:none;
  }
  .feedback-box.show{display:block;animation: fadein .3s ease;}

  /* grouping activity */
  .group-zone{
    display:flex;gap:18px;justify-content:center;flex-wrap:wrap;width:100%;
  }
  .category-box{
    flex:1;min-width:150px;max-width:230px;
    background:#fff;border-radius:var(--radius-md);
    padding:14px 10px 18px;
    box-shadow:var(--shadow);
    border:3px solid transparent;
    text-align:center;
    min-height:150px;
    transition: border-color .2s ease, background .2s ease;
  }
  .category-box .cat-emoji{font-size:34px;}
  .category-box .cat-name{font-size:17px;font-weight:800;color:var(--accent-dark);margin-top:4px;}
  .category-box.target-hint{border-color:var(--select-border);background:var(--select);}
  .category-box .placed{
    display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;
  }
  .placed .chip{
    background:var(--mint);border-radius:10px;padding:5px 9px;font-size:13px;font-weight:700;
  }

  .card-tray{
    display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;
    margin-top:6px;
  }
  .flash-card{
    background:#fff;border-radius:var(--radius-sm);
    box-shadow:var(--shadow);
    padding:10px;width:150px;
    cursor:pointer;border:4px solid transparent;
    transition: transform .15s ease, border-color .15s ease, opacity .2s ease;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .flash-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#f1eefc;}
  .flash-card .cap{font-size:14px;font-weight:700;text-align:center;}
  .flash-card.picked{border-color:var(--select-border);background:var(--select);}
  .flash-card.placed-out{opacity:0.35;pointer-events:none;}
  .flash-card:hover{transform:translateY(-3px);}

  /* multi select image grid */
  .grid-select{
    display:grid;grid-template-columns:repeat(auto-fit, minmax(170px,1fr));
    gap:16px;width:100%;max-width:980px;
  }
  .grid-item{
    background:#fff;border-radius:var(--radius-md);
    padding:10px;box-shadow:var(--shadow);
    border:4px solid transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    transition: border-color .15s ease, transform .15s ease;
  }
  .grid-item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#f1eefc;}
  .grid-item .cap{font-size:15px;font-weight:700;text-align:center;}
  .grid-item.selected{border-color:var(--select-border);background:var(--select);}
  .grid-item:hover{transform:translateY(-3px);}

  /* order activity */
  .order-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;width:100%;}
  .order-slot{
    width:150px;min-height:150px;border-radius:var(--radius-md);
    border:3px dashed #cfc9f0;background:#faf9ff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:14px;color:#a39fc0;font-weight:700;position:relative;
  }
  .order-slot .num-badge{
    position:absolute;top:-12px;left:-12px;
    background:var(--accent);color:#fff;
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
    box-shadow:var(--shadow);
  }
  .order-slot img{width:100%;height:100%;object-fit:cover;border-radius:16px;position:absolute;inset:0;}
  .order-slot.filled{border-style:solid;border-color:var(--select-border);}

  /* words pick */
  .word-row{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .word-chip{
    background:#fff;border-radius:26px;padding:18px 34px;
    font-size:24px;font-weight:800;color:var(--accent-dark);
    box-shadow:var(--shadow);cursor:pointer;border:4px solid transparent;
    transition: all .15s ease;
  }
  .word-chip.selected{background:var(--select);border-color:var(--select-border);}

  .final-msg{
    font-size:clamp(22px,3vw,32px);font-weight:900;color:var(--accent-dark);
    text-align:center;max-width:800px;line-height:1.4;
  }

  .hint-note{
    font-size:14px;color:var(--ink-soft);text-align:center;max-width:700px;
  }

  .stars-earned{
    font-size:30px;letter-spacing:6px;
  }

  .cover-illustration{
    display:flex;gap:14px;justify-content:center;margin:6px 0;
  }
  .cover-illustration .mini{
    width:74px;height:74px;border-radius:18px;background:#fff;
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:34px;
  }

  /* ---------- RESPONSIVE MOBILE ONLY ----------
     Desktop/IFP styles above remain unchanged.
  */
  @media (max-width: 820px){
    html,body{
      height:auto;
      min-height:100%;
      overflow-x:hidden;
      overflow-y:auto;
    }
    #app{
      width:100%;
      min-height:100vh;
      height:auto;
      display:flex;
      flex-direction:column;
    }
    #topbar{
      padding:8px 10px;
      gap:6px;
      flex-wrap:wrap;
    }
    #topbar .brand{
      font-size:14px;
      gap:6px;
      white-space:nowrap;
    }
    #topbar .brand .dot{width:10px;height:10px;}
    #progressWrap{
      order:3;
      width:100%;
      justify-content:center;
      gap:4px;
      min-width:0;
      overflow:hidden;
    }
    .progress-star{
      width:22px;height:22px;
      border-width:2px;
      font-size:11px;
      flex:0 0 22px;
    }
    #btnHome{
      padding:8px 11px;
      font-size:12px;
      border-radius:12px;
      margin-left:auto;
    }
    #screens{
      flex:none;
      position:relative;
      overflow:visible;
      width:100%;
    }
    .screen{
      position:relative;
      inset:auto;
      width:100%;
      min-height:0;
      padding:10px 14px 28px;
      overflow:visible;
    }
    .screen-inner{
      width:100%;
      max-width:none;
      flex:none;
      gap:12px;
    }
    h1.title{
      font-size:clamp(24px,7vw,32px);
      line-height:1.15;
    }
    p.subtitle{font-size:16px;line-height:1.4;}
    p.question{font-size:19px;line-height:1.35;}
    .rara-row{
      width:100%;
      padding:10px 13px;
      border-radius:18px;
    }
    .rara-text{font-size:15px;line-height:1.35;}
    .choice-row{
      width:100%;
      flex-direction:column;
      gap:14px;
      align-items:stretch;
    }
    .choice-card{
      width:100%;
      max-width:none;
      padding:10px;
      border-width:3px;
    }
    .choice-card .label{font-size:16px;line-height:1.3;}
    .grid-select{
      grid-template-columns:1fr;
      gap:12px;
      max-width:none;
    }
    .grid-item{
      padding:9px;
      border-width:3px;
    }
    .grid-item .cap{font-size:15px;line-height:1.3;}
    .group-zone{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    .category-box{
      min-width:0;
      max-width:none;
      min-height:120px;
      padding:10px 7px 14px;
    }
    .category-box .cat-emoji{font-size:28px;}
    .category-box .cat-name{font-size:14px;}
    .card-tray{gap:10px;}
    .flash-card{
      width:calc(50% - 5px);
      padding:8px;
    }
    .flash-card .cap{font-size:13px;line-height:1.25;}
    .order-row{gap:8px;}
    .order-slot{
      width:calc(33.333% - 6px);
      min-height:110px;
    }
    .word-row{gap:10px;}
    .word-chip{
      padding:14px 20px;
      font-size:20px;
    }
    .feedback-box{
      width:100%;
      padding:12px 14px;
      font-size:16px;
      line-height:1.4;
    }
    .btn-next-situasi{
      display:flex !important;
      width:100%;
      min-height:56px;
      align-items:center;
      justify-content:center;
      margin:16px 0 28px !important;
      position:relative;
      z-index:2;
      touch-action:manipulation;
    }
    #navbar{
      position:relative;
      width:100%;
      padding:10px 14px calc(18px + env(safe-area-inset-bottom, 0px));
      background:rgba(255,255,255,.96);
      border-top:1px solid rgba(92,90,110,.12);
      z-index:10;
    }
    #navbar .btn-round{
      width:50px;height:50px;
      flex:0 0 50px;
      touch-action:manipulation;
    }
    .btn{touch-action:manipulation;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="brand"><span class="dot"></span> Misi Detektif Aturan</div>
    <div id="progressWrap"></div>
    <button class="btn" id="btnHome" onclick="goToScreen(0)">🏠 Sampul</button>
  </div>

  <div id="screens"></div>

  <div id="navbar">
    <button class="btn btn-round" id="btnBack" onclick="prevScreen()">◀</button>
    <div id="navCenter"></div>
    <button class="btn btn-round" id="btnNext" onclick="nextScreen()">▶</button>
  </div>

</div>

<script>
/* =========================================================
   DATA — mudah diedit tanpa membongkar seluruh JavaScript
   Ganti path "images/..." sesuai asset yang kamu miliki.
   ========================================================= */

// Misi 1 — Kenali aturan lewat situasi kontras
const dataMisi1 = {

const kategoriBolehTidak = [
  {id:"boleh", emoji:"👍", name:"BOLEH"},
  {id:"tidak", emoji:"🚫", name:"TIDAK BOLEH"}
];
const kartuBolehTidak = [
  {img:"images/14-menjaga-kebersihan.png", label:"Menjaga kebersihan", target:"boleh"},

const dataMisi5 = [
  {img:"images/10-cuci-tangan.png", label:"Cuci tangan", order:1},

const dataMisi6 = [
  {

const dataMisi7 = [
  {
    question: "Lihat situasi ini. Apa yang sebaiknya dilakukan?",
    imageA: "images/06-kamar-berantakan.png",

// urutan: 0=cover, 1..8 = misi, 9 = penutup
const MISI_COUNT = 8;
let currentScreen = 0;
const progressDone = new Array(MISI_COUNT + 1).fill(false); // index 1..9 dipakai

function buildProgressBar(){
  const wrap = document.getElementById('progressWrap');
  wrap.innerHTML = '';
  for(let i=1;i<=MISI_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'progress-star';
    s.id = 'star-' + i;
    s.textContent = i;
    wrap.appendChild(s);
  }
}

function refreshProgressBar(){
  for(let i=1;i<=MISI_COUNT;i++){
    const el = document.getElementById('star-' + i);
    if(!el) continue;
    el.classList.toggle('done', progressDone[i]);
    el.classList.toggle('current', currentScreen === i);
  }
}

function markDone(misiIndex){
  progressDone[misiIndex] = true;
  refreshProgressBar();
}

function goToScreen(index){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + index);
  if(target) target.classList.add('active');
  currentScreen = index;
  refreshProgressBar();
  if(window.matchMedia && window.matchMedia('(max-width: 820px)').matches){
    window.scrollTo({top:0, behavior:'smooth'});
  }
  const back = document.getElementById('btnBack');
  const next = document.getElementById('btnNext');
  back.style.visibility = index === 0 ? 'hidden' : 'visible';
  next.style.visibility = index === 9 ? 'hidden' : 'visible';
}

function nextScreen(){
  if(currentScreen < 9) goToScreen(currentScreen + 1);
}
function prevScreen(){
  if(currentScreen > 0) goToScreen(currentScreen - 1);
}

/* =========================================================
   HELPER — komponen aktivitas yang dapat dipakai ulang
   ========================================================= */

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

// Aktivitas: pilih salah satu dari dua gambar besar (tanpa indikator benar/salah)
function renderChoiceTwo(container, data, onPicked){
  container.innerHTML = '';
  container.appendChild(el('p','question', data.question));

  const row = el('div','choice-row');
  const options = [
    {key:'A', img:data.imageA, label:data.labelA, feedback:data.feedbackA},
    {key:'B', img:data.imageB, label:data.labelB, feedback:data.feedbackB}
  ].sort(() => Math.random() - 0.5);

  const cards = {};
  let pickedOnce = false;
  const fb = el('div','feedback-box');

  options.forEach(opt => {
    const card = el('div','choice-card');
    const img = el('img'); img.src = opt.img; card.appendChild(img);
    card.appendChild(el('div','label', opt.label));
    card.addEventListener('click', () => {
      Object.values(cards).forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      fb.textContent = opt.feedback;
      fb.classList.add('show');
      if(!pickedOnce){
        pickedOnce = true;
        if(data.closingAfterPick){
          const rara = el('div','rara-row');
          rara.appendChild(el('div','rara-avatar','🙋‍♀️'));
          rara.appendChild(el('div','rara-text', data.closingAfterPick));
          container.appendChild(rara);
        }
      }
      if(onPicked) onPicked();
    });
    cards[opt.key] = card;
    row.appendChild(card);
  });
  container.appendChild(row);
  if(data.followUp) container.appendChild(el('p','question', data.followUp));
  container.appendChild(fb);
}

// Aktivitas: kelompokkan kartu (tap kartu lalu tap kategori tujuan)
function renderGrouping(container, categories, cards, onProgress){
  container.innerHTML = '';
  container.appendChild(el('p','question', 'Sentuh kartu, lalu sentuh tempat yang sesuai.'));

  const zone = el('div','group-zone');
  const catBoxes = {};
  categories.forEach(cat => {
    const box = el('div','category-box');
    box.appendChild(el('div','cat-emoji', cat.emoji));
    box.appendChild(el('div','cat-name', cat.name));
    const placed = el('div','placed');
    box.appendChild(placed);
    box.dataset.cat = cat.id;
    zone.appendChild(box);
    catBoxes[cat.id] = {box, placed};
  });
  container.appendChild(zone);

  const tray = el('div','card-tray');
  container.appendChild(tray);

  const fb = el('div','feedback-box');
  container.appendChild(fb);

  let selectedCard = null;
  let placedCount = 0;

  const shuffledCards = [...cards].sort(() => Math.random() - 0.5);
  const cardEls = shuffledCards.map((c) => {
    const card = el('div','flash-card');
    const img = el('img'); img.src = c.img; card.appendChild(img);
    card.appendChild(el('div','cap', c.label));
    card.dataset.target = c.target;
    tray.appendChild(card);

    card.addEventListener('click', () => {
      if(card.classList.contains('placed-out')) return;
      cardEls.forEach(x => x.classList.remove('picked'));
      card.classList.add('picked');
      selectedCard = card;
      fb.classList.remove('show');
      Object.values(catBoxes).forEach(cb => cb.box.classList.remove('target-hint'));
    });
    return card;
  });

  Object.entries(catBoxes).forEach(([id, cb]) => {
    cb.box.addEventListener('click', () => {
      if(!selectedCard) {
        fb.textContent = 'Pilih dulu satu kartu, ya!';
        fb.classList.add('show');
        return;
      }
      const chip = el('div','chip', selectedCard.querySelector('.cap').textContent);
      cb.placed.appendChild(chip);
      const isRight = selectedCard.dataset.target === id;
      fb.textContent = isRight
        ? 'Bagus. Itu memang salah satu contoh aturan di sana.'
        : 'Coba pikirkan lagi. Menurutmu, kegiatan itu biasanya dilakukan di mana?';
      fb.classList.add('show');
      if(isRight){
        selectedCard.classList.add('placed-out');
        placedCount++;
        if(onProgress) onProgress(placedCount, cards.length);
      }
      selectedCard.classList.remove('picked');
      selectedCard = null;
      cb.box.classList.remove('target-hint');
    });
  });

  return {getPlacedCount: () => placedCount};
}

// Aktivitas: pilih beberapa gambar yang sesuai (multi-select, tanpa indikator benar/salah)
function renderMultiSelect(container, data, onSelect){
  container.innerHTML = '';
  container.appendChild(el('p','question', data.question));
  const grid = el('div','grid-select');
  const fb = el('div','feedback-box');
  let closingShown = false;
  [...data.items].sort(() => Math.random() - 0.5).forEach(item => {
    const card = el('div','grid-item');
    const img = el('img'); img.src = item.img; card.appendChild(img);
    card.appendChild(el('div','cap', item.label));
    card.addEventListener('click', () => {
      card.classList.toggle('selected');
      const nowSelected = card.classList.contains('selected');
      if(nowSelected && item.feedback){
        fb.textContent = item.feedback;
        fb.classList.add('show');
      }
      const selectedCount = grid.querySelectorAll('.grid-item.selected').length;
      if(selectedCount > 0 && !closingShown && data.closing){
        closingShown = true;
        const rara = el('div','rara-row');
        rara.appendChild(el('div','rara-avatar','🙋‍♀️'));
        rara.appendChild(el('div','rara-text', data.closing));
        container.appendChild(rara);
      }
      if(onSelect) onSelect();
    });
    grid.appendChild(card);
  });
  container.appendChild(grid);
  container.appendChild(fb);
}

// Rangkaian beberapa perbandingan (misi 2, 4, 6 & 7) — guru menekan tombol
// "Lanjut" sendiri setelah selesai berdiskusi, tidak otomatis pindah.
function renderChoiceSequence(container, items, closingText, onAllDone){
  let step = 0;
  function renderStep(){
    container.innerHTML = '';
    if(step < items.length){
      const stepWrap = el('div');
      container.appendChild(stepWrap);
      renderChoiceTwo(stepWrap, items[step], () => {
        if(!stepWrap.querySelector('.btn-next-situasi')){
          const isLast = step === items.length - 1;
          const nextBtn = el('button','btn btn-secondary btn-next-situasi',
            isLast ? 'Lanjut ✅' : 'Lanjut ke situasi berikutnya ➡️');
          nextBtn.style.marginTop = '4px';
          nextBtn.onclick = () => { step++; renderStep(); };
          stepWrap.appendChild(nextBtn);
        }
      });
    } else {
      if(closingText){
        container.appendChild(el('div','rara-row',
          '<div class="rara-avatar">🙋‍♀️</div><div class="rara-text">' + closingText + '</div>'));
      }
      if(onAllDone) onAllDone();
    }
  }
  renderStep();
}

// Aktivitas: urutkan dengan tap (tap kartu sesuai urutan 1,2,3)
function renderOrdering(container, steps, onDone){
  container.innerHTML = '';
  container.appendChild(el('p','question','Sentuh kartu sesuai urutan kegiatan sebelum makan.'));

  const slots = [];
  const slotRow = el('div','order-row');
  for(let i=1;i<=steps.length;i++){
    const slot = el('div','order-slot');
    slot.appendChild(el('div','num-badge', i));
    slot.appendChild(document.createTextNode('Urutan ke-' + i));
    slotRow.appendChild(slot);
    slots.push(slot);
  }
  container.appendChild(slotRow);

  const tray = el('div','card-tray');
  const shuffled = [...steps].sort(() => Math.random() - 0.5);
  const fb = el('div','feedback-box');

  let nextExpected = 1;
  let doneCount = 0;

  shuffled.forEach(step => {
    const card = el('div','flash-card');
    const img = el('img'); img.src = step.img; card.appendChild(img);
    card.appendChild(el('div','cap', step.label));
    card.addEventListener('click', () => {
      if(card.classList.contains('placed-out')) return;
      if(step.order === nextExpected){
        const slot = slots[nextExpected - 1];
        slot.innerHTML = '';
        slot.classList.add('filled');
        const img2 = el('img'); img2.src = step.img; slot.appendChild(img2);
        slot.appendChild(el('div','num-badge', nextExpected));
        card.classList.add('placed-out');
        fb.textContent = 'Betul, langkah itu berada di urutan ke-' + nextExpected + '.';
        fb.classList.add('show');
        nextExpected++;
        doneCount++;
        if(doneCount === steps.length && onDone) onDone();
      } else {
        fb.textContent = 'Coba lihat lagi urutan yang sudah tersusun. Kira-kira ini giliran langkah yang mana?';
        fb.classList.add('show');
      }
    });
    tray.appendChild(card);
  });

  container.appendChild(tray);
  container.appendChild(fb);
}

// Aktivitas: pilih kata yang berhubungan
function renderWordPick(container, words, correctWords, onProgress){
  container.innerHTML = '';
  container.appendChild(el('p','question','Sentuh kata yang menurutmu berhubungan dengan aturan.'));
  const row = el('div','word-row');
  const fb = el('div','feedback-box');
  [...words].sort(() => Math.random() - 0.5).forEach(w => {
    const chip = el('div','word-chip', w);
    chip.addEventListener('click', () => {
      chip.classList.toggle('selected');
      fb.textContent = correctWords.includes(w)
        ? 'Ya, ' + w.toLowerCase() + ' berhubungan dengan aturan.'
        : 'Coba pikirkan lagi, apakah kata itu berhubungan dengan aturan?';
      fb.classList.add('show');
      if(onProgress) onProgress();
    });
    row.appendChild(chip);
  });
  container.appendChild(row);
  container.appendChild(fb);
}
